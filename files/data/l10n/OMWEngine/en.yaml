JiggleButtZOffsetLow: "Lower"
JiggleButtZOffsetHigh: "Higher"
JiggleResetCurrentWornOffset: "Reset Current Worn Body Z Offset"
JiggleResetCurrentWornOffsetTooltip: "Reset the live breast and butt Z offsets for the currently worn naked body, clothing, or armor mesh. Other outfits keep their saved offsets. Does not undo an offset already baked into a NIF."
JiggleBakeBreastToNif: "Bake Breast Offset Into NIF"
JiggleBakeBreastToNifTooltip: "Permanently write the current breast Z offset into the worn body's loose .nif file (both Bip01 L/R Breast bones), then zero the live offset. Only works for a loose, writable, pre-rigged NIF that already has breast bones - not auto-rigged bodies or meshes inside BSA archives. To undo, set the slider negative and bake again."
JiggleBakeDone: "Breast Z offset baked into the worn body's NIF. Reload the body (re-equip or reload a save) to see the baked result."
JiggleBakeNoMesh: "No worn body mesh to bake into."
JiggleBakeFailed: "Could not bake the breast offset into the NIF:"
JiggleGravityValue: "Jiggle Gravity ({value, number, ::.0})"
JiggleGravityLow: "Weightless"
JiggleGravityHigh: "Heavy Sag"
JiggleSoftnessValue: "Jiggle Softness ({value, number, ::.0})"
JiggleSoftnessLow: "Firm"
JiggleSoftnessHigh: "Soft"
JiggleQuicknessValue: "Jiggle Quickness ({value, number, ::.0})"
JiggleQuicknessLow: "Lazy"
JiggleQuicknessHigh: "Snappy"
JiggleMassResponseValue: "Jiggle Mass Response ({value, number, ::.00})"
JiggleMassResponseLow: "Uniform"
JiggleMassResponseHigh: "Size-Driven"
JiggleSideValue: "Jiggle Side Sway ({value, number, ::.00})"
JiggleSideLow: "Vertical Only"
JiggleSideHigh: "Loose Sway"
JiggleSelfCollisionLimitValue: "Jiggle Self-Collision Limit ({value, number, ::.0})"
JiggleSelfCollisionLimitLow: "Tight"
JiggleSelfCollisionLimitHigh: "Loose"
JiggleSelfCollision: "Jiggle Self-Collision"
JiggleSelfCollisionTooltip: |-
    Keeps jiggle and gravity sag from clipping the breast/butt bulge back into the body. When on, a jiggle bone cannot sink toward the body past the Self-Collision Limit, and its into-body motion stops there.
    Bone-space approximation of TittyMagic's soft self-collision and distance limit.
JiggleTogglesNote: "Enable or disable the in-engine jiggle features."
JiggleAutoRig: "In-Game Auto Jiggle"
JiggleAutoRigTooltip: |-
    Master switch for jiggle. When on, jiggle physics play and female bodies that lack jiggle bones are rigged automatically (so pre-rigging meshes with the Add Jiggle Bones tool is optional).
    Turning it off freezes all jiggle instantly; turning it on resumes it. Auto-rigging of a body applies when it is next loaded (reload a save or re-equip).
JiggleTab: "Jiggle"
OptionsMenuRealTime: "Options Menu Runs In Real Time"
OptionsMenuRealTimeTooltip: |-
    Keeps the game running while the Options menu is open, instead of pausing, so you can watch movement, physics and jiggle update live as you change settings.
    The console, message boxes and the main menu with no game loaded still pause as normal.
JigglePlayerOnly: "Player Only"
JigglePlayerOnlyTooltip: |-
    Restricts all jiggle to your own character - NPCs get no jiggle at all. Leave off to jiggle every female body.
    Applies when a body is next loaded (reload a save or re-equip).
JiggleThigh: "Thigh Jiggle"
JiggleThighTooltip: |-
    Also jiggles the upper-thigh flesh, mirroring the breast jiggle with the same spring, gravity and softness settings. Auto-rigs L/R thigh jiggle bones onto female bodies that lack them.
    Requires In-Game Auto Jiggle to be on. Applies when a body is next loaded (reload a save or re-equip).
JiggleSeamWelding: "Jiggle Seam Fixer"
JiggleSeamWeldingTooltip: |-
    Feathers jiggle weights to zero at mesh seams so the cracks jiggle opens between body parts/clothing are closed.
    Takes effect when a mesh is next loaded (reload a save or re-equip).
PerformanceNote: "Performance / VRAM options. Directory cache and BSA mapping apply on the next launch."
TextureDownscaleValue: "Texture Downscale ({value} px)"
TextureDownscaleOff: "0 = Off (full resolution)"
VfsDirectoryCache: "Cache directory scan (faster startup)"
VfsDirectoryCacheTooltip: |-
    Caches each data directory's file listing so subsequent startups skip re-scanning them - helps most with large modlists over a virtual filesystem (MO2).
    Takes effect on the next launch.
BsaMemoryMapping: "Memory-map BSA archives"
BsaMemoryMappingTooltip: |-
    Serves BSA entries from a demand-paged memory map instead of buffered reads, reducing per-asset load latency.
    Takes effect on the next launch.

