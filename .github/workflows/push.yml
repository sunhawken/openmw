name: Build and test

on:
- push
- pull_request

env:
  BUILD_TYPE: RelWithDebInfo

# Only the newest commit on a branch is useful for this long multi-platform
# validation workflow. Cancel superseded runs so rapid cape/physics iterations
# do not leave the current in-game candidate waiting behind stale builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Ubuntu:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Add OpenMW PPA Dependencies
      run: sudo add-apt-repository ppa:openmw/openmw; sudo apt-get update

    - name: Install Building Dependencies
      run: sudo CI/install_debian_deps.sh gcc openmw-deps openmw-deps-dynamic

    - name: Prime ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ matrix.os }}-${{ env.BUILD_TYPE }}
        max-size: 1000M

    - name: Configure
      run: >
        cmake .
        -D CMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -D OPENMW_USE_SYSTEM_RECASTNAVIGATION=ON
        -D USE_SYSTEM_TINYXML=ON
        -D BUILD_COMPONENTS_TESTS=ON
        -D BUILD_OPENMW_TESTS=ON
        -D BUILD_OPENCS_TESTS=OFF
        -D BUILD_OPENCS=OFF
        -D BUILD_LAUNCHER=OFF
        -D BUILD_WIZARD=OFF
        -D CMAKE_INSTALL_PREFIX=install

    - name: Build
      run: cmake --build . -- -j$(nproc)

    - name: Run components tests
      run: ./components-tests

    - name: Run OpenMW tests
      run: ./openmw-tests

    - name: Run OpenMW-CS tests
      if: false
      run: ./openmw-cs-tests

    - name: Assemble portable Linux runtime for Siff in-game test
      shell: bash
      run: |
        set -euxo pipefail
        mkdir -p siff-linux-runtime/bin siff-linux-runtime/lib siff-linux-runtime/osgPlugins-3.6.5
        cp ./openmw siff-linux-runtime/bin/openmw
        cp -a ./resources siff-linux-runtime/
        ldd ./openmw | awk '/=> \/|^\// { for (i=1;i<=NF;i++) if ($i ~ /^\//) print $i }' | sort -u > /tmp/openmw-libs.txt
        while read -r lib; do cp -L "$lib" siff-linux-runtime/lib/ || true; done < /tmp/openmw-libs.txt
        if [ -d /usr/lib/x86_64-linux-gnu/osgPlugins-3.6.5 ]; then
          cp -a /usr/lib/x86_64-linux-gnu/osgPlugins-3.6.5/. siff-linux-runtime/osgPlugins-3.6.5/
        fi
        tar -czf siff-linux-runtime.tar.gz siff-linux-runtime

    - name: Upload portable Linux runtime
      uses: actions/upload-artifact@v4
      with:
        name: siff-linux-runtime
        path: siff-linux-runtime.tar.gz
        retention-days: 1

    # - name: Install
    #   shell: bash
    #   run: cmake --install .

    # - name: Create Artifact
    #   shell: bash
    #   working-directory: install
    #   run: |
    #     ls -laR
    #     7z a ../build_artifact.7z .

    # - name: Upload Artifact
    #   uses: actions/upload-artifact@v1
    #   with:
    #     path: ./build_artifact.7z
    #     name: build_artifact.7z

  MacOS:
    strategy:
      fail-fast: true
      matrix:
        args:
          - image: macos-15
          - image: macos-15-intel
    uses: ./.github/workflows/macos.yml
    with:
      image: ${{ matrix.args.image }}

  Windows:
    strategy:
      fail-fast: true
      matrix:
        image:
        - "2022"

    uses: ./.github/workflows/windows.yml
    with:
      image: ${{ matrix.image }}
